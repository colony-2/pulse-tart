name: Orchard integration
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: orchard-lab
  cancel-in-progress: false
jobs:
  macos-guests:
    runs-on: [self-hosted, orchard-lab]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
      - run: make integration
        env:
          PULSE_TEST_BACKEND: orchard
          PULSE_TEST_ORCHARD_URL: ${{ vars.ORCHARD_URL }}
          PULSE_TEST_ORCHARD_WORKER: ${{ vars.ORCHARD_WORKER }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orchard-test-results
          path: test-results/
